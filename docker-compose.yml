version: "3.8"

services:
  ocpp-simulate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DEFAULT_CSMS_URL: ${VITE_DEFAULT_CSMS_URL:-}
    container_name: ocpp-simulate
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
