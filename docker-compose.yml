version: "3.8"

services:
  ocpp-simulate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-http://localhost:3001}
        VITE_OCPP_GATEWAY_URL: ${VITE_OCPP_GATEWAY_URL:-ws://localhost:8887}
    container_name: ocpp-simulate
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
